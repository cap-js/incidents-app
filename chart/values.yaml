serviceInstances:
  destination:
    name: incidents-destination
    serviceOfferingName: destination
    servicePlanName: lite
    parameters:
      HTML5Runtime_enabled: true
  html5RepoRuntime:
    name: incidents-html5-repo-runtime
    serviceOfferingName: html5-apps-repo
    servicePlanName: app-runtime
    parameters: {}
  html5RepoHost:
    name: incidents-html5-repo-host
    serviceOfferingName: html5-apps-repo
    servicePlanName: app-host
    parameters: {}
  xsuaa:
    name: incidents-uaa
    serviceOfferingName: xsuaa
    servicePlanName: broker
    parameters:
      xsappname: incidents
      tenant-mode: shared
      oauth2-configuration:
        credential-types:
          - binding-secret
        redirect-uris: []
  saasRegistry:
    name: incidents-saas-registry
    serviceOfferingName: saas-registry
    servicePlanName: application
    parameters:
      plan: general
      xsappname: incidents
      appName: incidents
      displayName: (incidents)
      description: (A simple CAP project.)
      appUrls:
        getDependencies: ""
        onSubscription: ""
        callbackTimeoutMillis: 300000
        onSubscriptionAsync: true
        onUnSubscriptionAsync: true
      category: CAP
  serviceManager:
    name: incidents-service-manager
    serviceOfferingName: service-manager
    servicePlanName: container
    parameters: {}
serviceBindings:
  destination:
    name: incidents-destination-bind
    serviceInstanceName: incidents-destination
    secretName: incidents-destination-bind-secret
    secretKey: credentials
    parameters: {}
  html5RepoRuntime:
    name: incidents-html5-repo-runtime-bind
    serviceInstanceName: incidents-html5-repo-runtime
    secretName: incidents-html5-repo-runtime-bind-secret
    secretKey: credentials
    parameters: {}
  html5RepoHost:
    name: incidents-html5-repo-host-bind
    serviceInstanceName: incidents-html5-repo-host
    secretName: incidents-html5-repo-host-bind-secret
    secretKey: credentials
    parameters: {}
  xsuaa:
    name: incidents-uaa-bind
    serviceInstanceName: incidents-uaa
    secretName: incidents-uaa-bind-secret
    secretKey: credentials
    parameters: {}
  saasRegistry:
    name: incidents-saas-registry-bind
    serviceInstanceName: incidents-saas-registry
    secretName: incidents-saas-registry-bind-secret
    secretKey: credentials
    parameters: {}
  serviceManager:
    name: incidents-service-manager-bind
    serviceInstanceName: incidents-service-manager
    secretName: incidents-service-manager-bind-secret
    secretKey: credentials
    parameters: {}
app:
  domains:
    primary: null
    additionalDomainRefs: []
  istioIngressGatewayLabels:
    istio: ingressgateway
    app: istio-ingressgateway
btp:
  globalAccountId: null
  provider:
    subdomain: null
    tenantId: null
imagePullSecrets: []
workloads:
  appRouter:
    name: app-router
    labels:
      sme.sap.com/app-type: incidents
    consumedBTPServices:
      - incidents-uaa-bind
      - incidents-saas-registry-bind
      - incidents-destination-bind
      - incidents-html5-repo-runtime-bind
    deploymentDefinition:
      type: Router
      image: null
      ports:
        - name: router-port
          port: 5000
  server:
    name: server
    labels:
      sme.sap.com/app-type: incidents
    consumedBTPServices:
      - incidents-uaa-bind
      - incidents-saas-registry-bind
      - incidents-service-manager-bind
    deploymentDefinition:
      type: CAP
      image: null
  contentDeploy:
    name: content-deploy
    labels:
      sme.sap.com/app-type: incidents
    consumedBTPServices:
      - incidents-uaa-bind
      - incidents-html5-repo-host-bind
    jobDefinition:
      type: Content
      image: null
  tenantJob:
    name: tenant-job
    labels:
      sme.sap.com/app-type: incidents
    consumedBTPServices:
      - incidents-uaa-bind
      - incidents-saas-registry-bind
      - incidents-service-manager-bind
    jobDefinition:
      type: TenantOperation
      image: null
  custom-op:
    name: custom-op
    consumedBTPServices:
      - incidents-uaa-bind
    jobDefinition:
      type: CustomTenantOperation
      image: busybox:latest
      command: ["sh", "-c", "exit 0"]

tenantOperations:
  provisioning:
  - workloadName: custom-op
  - workloadName: tenant-job
  upgrade:
  - workloadName: custom-op
  - workloadName: tenant-job
