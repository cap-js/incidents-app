_schema-version: 3.3.0
ID: capire.incidents
version: 1.0.0
description: "A simple CAP project."
parameters:
  enable-parallel-deployments: true
  deploy_mode: html5-repo
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production
modules:
  - name: incidents-srv
    type: nodejs
    path: gen/srv
    parameters:
      instances: 1
      buildpack: nodejs_buildpack
      routes:
        - route: "${default-url}"
        - route: "${default-host}.cert.${default-domain}"
    build-parameters:
      builder: npm-ci
    provides:
      - name: srv-api # required by consumers of CAP services (e.g. approuter)
        properties:
          srv-url: ${default-url}
          srv-cert-url: '${protocol}://${default-host}.cert.${default-domain}'
    requires:
      - name: incidents-ias
        parameters:
          config:
            credential-type: X509_GENERATED
            app-identifier: srv
      - name: incidents-db
      - name: incidents-ai

  - name: incidents
    type: approuter.nodejs
    path: .deploy/app-router
    requires:
      - name: incidents-ias
        parameters:
          config:
            credential-type: X509_GENERATED
            app-identifier: approuter
      - name: srv-api
        group: destinations
        properties:
          url: ~{srv-cert-url}
          forwardAuthCertificates: true
          forwardAuthToken: true
          strictSSL: true
    parameters:
      keep-existing-routes: true
      disk-quota: 256M
      memory: 256M
    provides:
      - name: app-api
        properties:
          app-protocol: ${protocol}
          app-uri: ${default-uri}

  - name: incidents-db-deployer
    type: hdb
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack
    requires:
      - name: incidents-db

  - name: incidents-app-deployer
    type: com.sap.application.content
    path: gen
    build-parameters:
      build-result: app/
      requires:
        - name: incidentsanalytics
          artifacts:
            - analytics.zip
          target-path: app/
        - name: incidentsincidents
          artifacts:
            - incidents.zip
          target-path: app/
    requires:
      - name: srv-api
      - name: incidents-app-front
        parameters:
          content-target: true
          config:
            IASDependencyName: incidents-ias-api
    parameters:
      config:
        destinations:
          - name: srv-api
            url: ~{srv-api/srv-url}
            forwardAuthToken: true
            IASDependencyName: incidents-ias-api
          - name: ui5
            url: https://ui5.sap.com

  - name: incidentsanalytics
    type: html5
    path: app/analytics
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm ci
        - npm run build
      supported-platforms:
        []
  - name: incidentsincidents
    type: html5
    path: app/incidents
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm ci
        - npm run build
      supported-platforms:
        []

resources:
  - name: incidents-ias
    type: org.cloudfoundry.managed-service
    requires:
      - name: app-api
    parameters:
      service: identity
      service-name: incidents-ias
      service-plan: application
      config:
        provided-apis:
          - name: incidents-ias-api
            description: API exposed by the application
        display-name: incidents
        oauth2-configuration:
          token-policy:
            access-token-format: "jwt"
          redirect-uris:
            - http://localhost:5000/login/callback?authType=ias
            - ~{app-api/app-protocol}://*~{app-api/app-uri}/login/callback
          post-logout-redirect-uris:
            - ~{app-api/app-protocol}://*~{app-api/app-uri}/*/logout.html
        xsuaa-cross-consumption: true
  - name: incidents-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared
  - name: incidents-ai
    type: org.cloudfoundry.managed-service
    parameters:
      service: aicore
      service-plan: extended
  - name: incidents-app-front
    type: org.cloudfoundry.managed-service
    parameters:
      service: app-front
      service-plan: developer
