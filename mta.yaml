_schema-version: "3.1"
ID: sdmincidents
description: Extend Upload Set to Fiori Elements and utilize Document Management Service
version: 1.0.0
modules:
  - name: incidents-srv
    type: nodejs
    path: gen/srv
    requires:
      - name: sdi-hana
      - name: sdm-incidents-auth
      - name: sdm-di-destination
      - name: sdm
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
    parameters:
      buildpack: nodejs_buildpack
    properties:
        REPOSITORY_ID: 2a1d4d1c-7bcf-40ea-b202-f24bb0ca6e5b
        INCOMING_REQUEST_TIMEOUT: 3600000
        INCOMING_SESSION_TIMEOUT: 3600000
        INCOMING_CONNECTION_TIMEOUT: 3600000
    build-parameters:
      builder: npm
  - name: incidents-db-deployer
    type: hdb
    path: gen/db
    requires:
      - name: sdi-hana
    parameters:
      buildpack: nodejs_buildpack
  - name: incidents-destination-content
    type: com.sap.application.content
    requires:
      - name: srv-api
      - name: sdm-incidents-auth
        parameters:
          service-key:
            name: incidents-auth-key
      - name: incidents-repo-host
        parameters:
          service-key:
            name: incidents-repo-host-key
      - name: sdm-di-destination
        parameters:
          content-target: true
    parameters:
      content:
        instance:
          destinations:
            - Name: incidents-repo-host
              ServiceInstanceName: incidents-html5-srv
              ServiceKeyName: incidents-repo-host-key
              sap.cloud.service: approuter
            - Authentication: OAuth2UserTokenExchange
              Name: sdm-incidents-auth
              ServiceInstanceName: sdm-incidents-auth
              ServiceKeyName: incidents-auth-key
              sap.cloud.service: approuter
            - Authentication: OAuth2UserTokenExchange
              Name: incidents-srv
              TokenServiceInstanceName: sdm-incidents-auth
              TokenServiceKeyName: incidents-auth-key
              URL: ~{srv-api/srv-url}
              sap.cloud.service: approuter
              timeout: 3600000
              HTML5.Timeout: 3600000
              HTML5.SocketReadTimeoutInSeconds: 3600
          existing_destinations_policy: update
    build-parameters:
      no-source: true
  - name: incidents-app-content
    type: com.sap.application.content
    path: .
    requires:
      - name: incidents-repo-host
        parameters:
          content-target: true
    build-parameters:
      build-result: resources
      requires:
        - artifacts:
            - incidents.zip
          name: sdmincidents
          target-path: resources/
  - name: sdmincidents
    type: html5
    path: app/incidents
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm install
        - npm run build:cf
      supported-platforms: []
  - name: incidents-approuter
    type: approuter.nodejs
    path: app/router
    build-parameters:
      ignore:
        - "default-env.json"
    parameters:
      keep-existing-routes: true
      disk-quota: 256M
      memory: 256M
    properties:
      INCOMING_REQUEST_TIMEOUT: 3600000
      INCOMING_SESSION_TIMEOUT: 3600000
      INCOMING_CONNECTION_TIMEOUT: 3600000
    requires:
      - name: srv-api
        group: destinations
        properties:
          name: incidents-srv
          url: ~{srv-url}
          forwardAuthToken: true
          timeout: 3600000
      - name: sdm-incidents-auth
      - name: incidents-html5-runtime
      - name: sdm-di-destination
    provides:
      - name: app-api
        properties:
          app-url: '${default-url}'
resources:
  - name: sdi-hana
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared
  - name: sdm-incidents-auth
    type: org.cloudfoundry.managed-service
    parameters:
      config:
        tenant-mode: dedicated
        xsappname: sdmincidents
        oauth2-configuration:
          redirect-uris:
            - ~{app-api/app-url}/**
      path: ./xs-security.json
      service: xsuaa
      service-keys:
        - name: incidents-auth-key
      service-plan: application
    requires:
      - name: app-api
  - name: sdm-di-destination
    type: org.cloudfoundry.managed-service
    parameters:
      config:
        HTML5Runtime_enabled: true
        init_data:
          instance:
            destinations:
              - Authentication: NoAuthentication
                Name: ui5
                ProxyType: Internet
                Type: HTTP
                URL: https://ui5.sap.com
            existing_destinations_policy: update
        version: 1.0.0
      service: destination
      service-keys:
        - name: incidents-destination-key
      service-plan: lite
  - name: incidents-repo-host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-name: incidents-html5-srv
      service-plan: app-host
  - name: incidents-html5-runtime
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-runtime
  - name: sdm
    type: org.cloudfoundry.managed-service
    parameters:
      service: sdm
      service-plan: standard
parameters:
  enable-parallel-deployments: true
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npx cds build --production
